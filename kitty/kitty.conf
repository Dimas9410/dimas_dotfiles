# ==========================================
# FONTS & SIZING
# ==========================================
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 33

# ==========================================
# CURSOR CUSTOMIZATION
# ==========================================
cursor_shape beam
cursor_beam_thickness 1.7
cursor_underline_thickness 2.0 
cursor_blink_interval 0.0
cursor_trail 1
cursor_trail_decay 0.01 0.6
cursor_trail_start_threshold 0

# ==========================================
# WINDOW LAYOUT & BLUR EFFECT
# ==========================================
window_padding_width 10
background_opacity 0.95
remember_window_size no
initial_window_width 70c
initial_window_height 23c
confirm_os_window_close 1
linux_display_server wayland

# ==========================================
# PERFORMANCE & SHADERS
# ==========================================
input_delay 3
sync_to_monitor yes
custom_shaders motion_blur
enable_audio_bell no

# ==========================================
# TAB BAR STYLE
# ==========================================
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style angled
tab_bar_min_tabs 2
tab_title_max_length 20
active_tab_font_style bold
inactive_tab_font_style normal

# ==========================================
# THEME & PASTE
# ==========================================
include catppuccin_frappe.conf 
wayland_titlebar_color background
paste_actions replace-dangerous-control-codes,filter
map ctrl+c copy_and_clear_or_interrupt
map ctrl+v paste_from_clipboard
copy_on_select clipboard
mouse_map right press ungrabbed paste_from_clipboard
